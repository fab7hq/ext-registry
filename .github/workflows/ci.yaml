name: Catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out exact Fab7 validator
        uses: actions/checkout@v6
        with:
          repository: fab7hq/fab7
          ref: v0.1.0
          path: fab7-validator
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
      - name: Validate catalog
        run: >-
          uv run
          --project fab7-validator
          --python 3.14.6
          --locked
          fab7 ext list
          --catalog "${GITHUB_WORKSPACE}/catalog.yaml"
          --json
