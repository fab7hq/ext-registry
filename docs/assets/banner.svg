<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="auto">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid-registry" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161b22" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#30363d" />
    </pattern>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background & Technical Blueprint Grid -->
  <rect width="1200" height="450" fill="#0d1117" rx="8"/>
  <rect width="1200" height="450" fill="url(#grid-registry)" rx="8"/>

  <!-- Outer Blueprint Frame -->
  <rect x="15" y="15" width="1170" height="420" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8 4" rx="4"/>
  <rect x="25" y="25" width="1150" height="400" fill="none" stroke="#21262d" stroke-width="1" rx="2"/>

  <!-- Header Technical Labels -->
  <text x="45" y="50" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">EXT-REGISTRY // CATALOG SCHEMATIC</text>
  <text x="45" y="66" fill="#8b949e" font-family="monospace" font-size="10" letter-spacing="1">REVIEWED FAB7 EXTENSION CATALOG &amp; IMMUTABLE SOURCE INDEX [CATALOG.YAML]</text>

  <text x="1000" y="50" fill="#3fb950" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">STATUS: VERIFIED</text>

  <!-- Left Side: Catalog Drawer & Punch Card Deck Sketch -->
  <g transform="translate(60, 75)" opacity="0.95">
    <!-- Catalog Storage Cabinet Frame -->
    <rect x="30" y="20" width="170" height="190" fill="none" stroke="#58a6ff" stroke-width="1.5" rx="3"/>
    <text x="115" y="12" fill="#58a6ff" font-family="monospace" font-size="9" text-anchor="middle">CATALOG DRAWER INDEX</text>

    <!-- Drawer 1: Denim -->
    <rect x="42" y="38" width="146" height="52" fill="none" stroke="#388bfd" stroke-width="1.2" rx="2"/>
    <circle cx="115" cy="64" r="5" fill="none" stroke="#8b949e" stroke-width="1.2"/>
    <text x="50" y="56" fill="#39c5bb" font-family="monospace" font-size="8" font-weight="bold">01: DENIM</text>
    <text x="50" y="74" fill="#8b949e" font-family="monospace" font-size="7">SHA-256: d9f43f7e...</text>

    <!-- Drawer 2: Verified Node Slot -->
    <rect x="42" y="112" width="146" height="52" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4 2" rx="2"/>
    <circle cx="115" cy="138" r="5" fill="none" stroke="#30363d" stroke-width="1"/>
    <text x="50" y="130" fill="#8b949e" font-family="monospace" font-size="8">02: EXTENSION REPO</text>
    <text x="50" y="148" fill="#30363d" font-family="monospace" font-size="7">IMMUTABLE SOURCE</text>

    <!-- Annotations -->
    <line x1="180" y1="64" x2="205" y2="64" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="210" y="67" fill="#8b949e" font-family="monospace" font-size="9">1A. EXTENSION ENTRIES</text>

    <line x1="180" y1="138" x2="205" y2="138" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="210" y="141" fill="#8b949e" font-family="monospace" font-size="9">1B. STRICT SCHEMA 1</text>
  </g>

  <!-- Center: SHA-256 & Target Host Matrix Network -->
  <g transform="translate(320, 110)">
    <!-- Interconnecting Data Paths -->
    <path d="M 0 80 L 480 80" fill="none" stroke="#39c5bb" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <path d="M 0 120 L 480 120" fill="none" stroke="#d29922" stroke-width="1.5" filter="url(#glow-amber)"/>

    <!-- Verification Nodes -->
    <g text-anchor="middle">
      <!-- Node 1: Catalog.yaml (Lowered to avoid overlap) -->
      <rect x="50" y="60" width="85" height="40" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" rx="3"/>
      <text x="92" y="78" fill="#f0f6fc" font-family="monospace" font-size="9" font-weight="bold">CATALOG</text>
      <text x="92" y="90" fill="#8b949e" font-family="monospace" font-size="7">YAML (STD)</text>

      <!-- Node 2: Immutable Release Source -->
      <rect x="200" y="60" width="90" height="40" fill="#0d1117" stroke="#39c5bb" stroke-width="1.5" filter="url(#glow-cyan)" rx="3"/>
      <text x="245" y="78" fill="#39c5bb" font-family="monospace" font-size="9" font-weight="bold">SOURCE.ZIP</text>
      <text x="245" y="90" fill="#8b949e" font-family="monospace" font-size="7">RELEASE TAG</text>

      <!-- Node 3: SHA-256 Verification -->
      <polygon points="360,95 385,80 410,95 385,110" fill="#0d1117" stroke="#3fb950" stroke-width="1.5" filter="url(#glow-green)"/>
      <text x="385" y="98" fill="#3fb950" font-family="monospace" font-size="8" font-weight="bold">SHA256</text>
    </g>

    <!-- Vertical Verification Pillars -->
    <line x1="92" y1="100" x2="92" y2="150" stroke="#388bfd" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="245" y1="100" x2="245" y2="150" stroke="#39c5bb" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="385" y1="110" x2="385" y2="150" stroke="#3fb950" stroke-width="0.8" stroke-dasharray="2 2"/>
  </g>

  <!-- Right Side: Target Host Adapters (Claude Code & Codex CLI) -->
  <g transform="translate(820, 80)" opacity="0.95">
    <!-- Target Host Adapters Rack -->
    <rect x="20" y="20" width="130" height="160" fill="none" stroke="#58a6ff" stroke-width="1.5" rx="3"/>
    <text x="85" y="12" fill="#58a6ff" font-family="monospace" font-size="9" text-anchor="middle">HOST ADAPTERS</text>

    <!-- Adapter 1: Claude Code -->
    <rect x="30" y="35" width="110" height="50" fill="none" stroke="#d29922" stroke-width="1.2" filter="url(#glow-amber)" rx="2"/>
    <text x="85" y="55" fill="#d29922" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">CLAUDE CODE</text>
    <text x="85" y="70" fill="#8b949e" font-family="monospace" font-size="7" text-anchor="middle">/fab7:* PLUGIN</text>

    <!-- Adapter 2: Codex CLI -->
    <rect x="30" y="105" width="110" height="50" fill="none" stroke="#39c5bb" stroke-width="1.2" filter="url(#glow-cyan)" rx="2"/>
    <text x="85" y="125" fill="#39c5bb" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">CODEX CLI</text>
    <text x="85" y="140" fill="#8b949e" font-family="monospace" font-size="7" text-anchor="middle">$fab7:* PLUGIN</text>

    <!-- Output Bundle Roll -->
    <ellipse cx="220" cy="95" rx="28" ry="50" fill="none" stroke="#388bfd" stroke-width="2"/>
    <ellipse cx="220" cy="95" rx="12" ry="22" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <line x1="150" y1="60" x2="220" y2="45" stroke="#388bfd" stroke-width="1"/>
    <line x1="150" y1="130" x2="220" y2="145" stroke="#39c5bb" stroke-width="1"/>

    <!-- Annotations -->
    <line x1="85" y1="180" x2="85" y2="200" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="85" y="212" fill="#8b949e" font-family="monospace" font-size="9" text-anchor="middle">2A. TARGET HOSTS</text>
  </g>

  <!-- Separate Bottom Branding Bar (Zero Overlap with Drawing) -->
  <g transform="translate(45, 305)">
    <!-- Divider Line -->
    <line x1="0" y1="0" x2="1110" y2="0" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 3"/>
    
    <!-- Title & Tagline at the Very Bottom -->
    <text x="555" y="45" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="8" text-anchor="middle" filter="url(#glow-cyan)">EXT-REGISTRY</text>
    <text x="555" y="72" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="600" letter-spacing="4" text-anchor="middle">FAB7 REVIEWED EXTENSION CATALOG &amp; DISCOVERY INDEX</text>
    <text x="555" y="94" fill="#8b949e" font-family="monospace" font-size="11" letter-spacing="2" text-anchor="middle">IMMUTABLE BUNDLES // SHA-256 INTEGRITY // STRICT SCHEMA 1 // HOST NEUTRAL</text>
  </g>
</svg>
